<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Portal Login - AI Resume Analyzer</title>
  
  <!-- CSS Stylesheets -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-cpu-fill fs-3 text-info"></i>
        <span>ATS Resume Analyzer</span>
      </a>
      <div class="d-flex">
        <a href="index.html" class="btn btn-sm btn-outline-custom">
          <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
        </a>
      </div>
    </div>
  </nav>

  <!-- Auth Wrapper -->
  <div class="container auth-container">
    <div class="auth-card">
      
      <!-- Tabs Selector -->
      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login" onclick="toggleAuthForm('login')">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </div>
        <div class="auth-tab" id="tab-register" onclick="toggleAuthForm('register')">
          <i class="bi bi-person-plus-fill me-1"></i> Register
        </div>
      </div>

      <!-- Notification Alerts -->
      <div class="auth-alert auth-alert-danger" id="auth-error-alert"></div>
      <div class="auth-alert auth-alert-success" id="auth-success-alert"></div>

      <!-- Form 1: Sign In -->
      <form id="login-form">
        <div class="form-group-custom">
          <label for="login-email">Email Address</label>
          <div class="input-icon-wrapper">
            <i class="bi bi-envelope-fill"></i>
            <input type="email" class="form-control form-control-dark" id="login-email" placeholder="name@example.com" required>
          </div>
        </div>
        
        <div class="form-group-custom">
          <label for="login-password">Password</label>
          <div class="input-icon-wrapper">
            <i class="bi bi-lock-fill"></i>
            <input type="password" class="form-control form-control-dark" id="login-password" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-premium w-100 py-2.5 mt-3 d-flex align-items-center justify-content-center gap-2">
          <i class="bi bi-box-arrow-in-right"></i>
          <span>Log In to Account</span>
        </button>
      </form>

      <!-- Form 2: Register -->
      <form id="register-form" class="d-none">
        <div class="form-group-custom">
          <label for="register-name">Full Name</label>
          <div class="input-icon-wrapper">
            <i class="bi bi-person-fill"></i>
            <input type="text" class="form-control form-control-dark" id="register-name" placeholder="John Doe" required>
          </div>
        </div>

        <div class="form-group-custom">
          <label for="register-email">Email Address</label>
          <div class="input-icon-wrapper">
            <i class="bi bi-envelope-fill"></i>
            <input type="email" class="form-control form-control-dark" id="register-email" placeholder="name@example.com" required>
          </div>
        </div>
        
        <div class="form-group-custom">
          <label for="register-password">Password</label>
          <div class="input-icon-wrapper">
            <i class="bi bi-lock-fill"></i>
            <input type="password" class="form-control form-control-dark" id="register-password" placeholder="Min. 6 characters" required>
          </div>
        </div>

        <button type="submit" class="btn btn-premium w-100 py-2.5 mt-3 d-flex align-items-center justify-content-center gap-2">
          <i class="bi bi-person-plus-fill"></i>
          <span>Create Account</span>
        </button>
      </form>

      <div class="auth-footer">
        <span class="small" id="footer-text">Don't have an account? <a href="#" onclick="toggleAuthForm('register')">Register Now</a></span>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Main Suite Theme Handlers -->
  <script src="js/dashboard.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
